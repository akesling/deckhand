[package]
name = "deckhand"
version = "0.1.0"
edition = "2024"
description = "Present markdown slide decks as a TUI, with embedded live terminals and a presenter-notes side channel"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.8"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-term = "0.2"
unicode-width = "0.2"
vt100 = "0.15"

[profile.release]
lto = true
