[package]
name = "deckhand"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Present markdown slide decks as a TUI — live embedded terminals, a 2-D slide grid, presenter notes, and a wasm presenter for the browser"
license = "MIT"
homepage = "https://deckhand.sh"
repository = "https://github.com/akesling/deckhand"
documentation = "https://docs.rs/deckhand"
readme = "README.md"
keywords = ["presentation", "slides", "tui", "terminal", "markdown"]
categories = ["command-line-utilities", "text-processing", "wasm"]
# Leading slashes anchor to the package root — unanchored patterns
# match gitignore-style anywhere, pulling in site/node_modules files
# with the same names.
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/examples/demo.md",
    "/examples/json-demo/**",
]

[lib]
crate-type = ["cdylib", "rlib"]

# Portable core: parsing, markdown rendering, theming, terminal
# emulation for snapshot replay. Compiles for native and wasm32 (the
# browser build on the website).
[dependencies]
anyhow = "1"
base64 = "0.22"
pulldown-cmark = { version = "0.12", default-features = false }
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tui-term = "0.2"
unicode-width = "0.2"
vt100 = "0.15"

# Native-only: the terminal UI, PTYs, notes socket, HTTP fetching, CLI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
portable-pty = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "underline-color"] }
reqwest = "0.12"
tokio = { version = "1", features = ["rt"] }

# `pdf` feature only: `deckhand compile -o talk.pdf`.
miniz_oxide = { version = "0.9", optional = true }
pdf-writer = { version = "0.13", optional = true }
subsetter = { version = "0.2", optional = true }
ttf-parser = { version = "0.25", optional = true }

[features]
default = ["html", "pdf"]
# `deckhand compile -o talk.html`: export a self-contained static HTML
# page (native only, no extra dependencies).
html = []
# `deckhand compile -o talk.pdf`: render a deck to PDF (native only; a
# no-op for wasm builds, whose target has none of these dependencies).
pdf = ["dep:miniz_oxide", "dep:pdf-writer", "dep:subsetter", "dep:ttf-parser"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
